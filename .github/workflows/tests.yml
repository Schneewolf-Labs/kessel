name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest

  # Every merge method against mergekit on the same tiny models (float32 must be bit-exact).
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # mergekit 0.1.4's pydantic models don't build on current torch; pin the stack it was verified on
      - name: Install dependencies
        run: >-
          pip install --extra-index-url https://download.pytorch.org/whl/cpu
          torch==2.7.1 transformers==5.3.0 peft==0.18.1 mergekit==0.1.4 -e ".[dev]"

      - name: Parity tests
        run: pytest -v tests/test_parity.py tests/test_cli.py
