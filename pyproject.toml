[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kessel"
dynamic = ["version"]
description = "Model merging by tensor name: mergekit-compatible configs, FP8/FP4 checkpoints, rank-1 edits"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "safetensors>=0.4", "pyyaml", "huggingface_hub", "tqdm"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "transformers", "peft"]

[project.scripts]
kessel = "kessel.cli:main"

[tool.setuptools.dynamic]
version = { attr = "kessel._version.__version__" }

[tool.setuptools.packages.find]
include = ["kessel*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
